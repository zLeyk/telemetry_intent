[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-chatito-generator"
version = "0.1.0"
description = "Semantic-card-driven telemetry text templates with verified Chatito expansion"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
telemetry-chatito = "telemetry_chatito.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
